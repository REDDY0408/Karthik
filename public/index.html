<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rummy Friends</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b3d2e;color:#fff;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#f5b301;color:#222;font-weight:700}
button.sec{background:#1d6b52;color:#fff}
button.red{background:#c0392b;color:#fff}
button:disabled{opacity:.4}
input{font:inherit;padding:12px;border-radius:10px;border:0;width:100%;margin:6px 0}
.screen{display:none;flex:1;flex-direction:column;padding:16px;overflow:auto}
.screen.on{display:flex}
h1{margin:8px 0 16px;text-align:center}
.box{background:#12523d;border-radius:14px;padding:14px;margin:8px 0}
.code{font-size:34px;letter-spacing:6px;text-align:center;font-weight:800}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.pl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff22}
#bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#08291e;font-size:13px}
#players{display:flex;gap:6px;padding:6px;overflow-x:auto}
.chip{min-width:84px;background:#12523d;border-radius:10px;padding:5px 8px;font-size:12px;text-align:center}
.chip.turn{outline:2px solid #f5b301}.chip.gone{opacity:.45}
#table{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:120px}
#piles{display:flex;gap:26px;align-items:center}
.card{width:46px;height:66px;border-radius:7px;background:#fff;color:#111;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1;border:1px solid #999;position:relative;flex:none}
.card b{font-size:17px}.card.red{color:#c0392b}
.card.joker{color:#7d3c98}.card.joker small{font-size:8px}
.card.wild::after{content:"W";position:absolute;top:1px;right:3px;font-size:9px;color:#e67e22;font-weight:800}
.card.back{background:repeating-linear-gradient(45deg,#2c5aa0,#2c5aa0 6px,#244a85 6px,#244a85 12px);color:#fff}
.card.big{width:56px;height:80px}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 2px #f5b301}
.pile{text-align:center;font-size:11px}
.pile.can .card{box-shadow:0 0 0 3px #f5b301}
#msg{font-size:14px;min-height:20px;text-align:center}
#hand{display:flex;flex-wrap:wrap;gap:8px 12px;padding:22px 8px 8px;justify-content:center;min-height:120px}
.grp{display:flex;align-items:flex-end}
.grp .card+.card{margin-left:-24px}
.plus{margin-left:4px;padding:2px 8px;border-radius:50%;background:#f5b301}
#ctl{display:flex;gap:6px;padding:8px;background:#08291e}#ctl button{flex:1;padding:12px 4px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal.on{display:flex}
.mb{background:#12523d;border-radius:14px;padding:14px;max-height:90vh;overflow:auto;width:100%;max-width:480px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;text-align:center;border-bottom:1px solid #ffffff22}td:first-child,th:first-child{text-align:left}
.mini{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.mini .grp .card{transform:scale(.62);margin:-10px -6px -10px -6px}.mini .grp .card+.card{margin-left:-24px}
.small{font-size:12px;opacity:.8}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#c0392b;padding:8px 14px;border-radius:10px;display:none;z-index:20}
</style>
</head>
<body>
<div id="toast"></div>

<div id="home" class="screen on">
  <h1>🃏 Rummy Friends</h1>
  <div class="box">
    <div class="small">Your name</div>
    <input id="name" maxlength="14" placeholder="Enter your name">
    <button id="create" style="width:100%;margin-top:6px">Create room</button>
  </div>
  <div class="box">
    <div class="small">Have a code or link?</div>
    <input id="code" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase">
    <button id="join" class="sec" style="width:100%">Join room</button>
  </div>
  <div class="small" style="text-align:center">13-card Indian Rummy (Points) · 2 to 6 players<br>Drop 25 / 50 · Full count 80 · Out at 101</div>
</div>

<div id="lobby" class="screen">
  <h1>Waiting room</h1>
  <div class="box"><div class="small" style="text-align:center">Room code</div><div class="code" id="lcode"></div></div>
  <button id="invite" style="background:#25d366;color:#fff">📲 Invite friends on WhatsApp</button>
  <div class="box" id="lplayers"></div>
  <button id="start">Start game</button>
  <div id="lwait" class="small" style="text-align:center;margin-top:8px"></div>
  <button id="lleave" class="sec" style="margin-top:12px">Leave</button>
</div>

<div id="game" class="screen" style="padding:0">
  <div id="bar">
    <span id="deal"></span>
    <span id="wildbox" style="display:flex;align-items:center;gap:6px">Joker: <span id="wild"></span></span>
    <span id="timer"></span>
    <button id="board" class="sec" style="padding:6px 10px">📊</button>
  </div>
  <div id="players"></div>
  <div id="table">
    <div id="piles">
      <div class="pile" id="stockp"><div class="card back big"></div><div id="stockn"></div>Stock</div>
      <div class="pile" id="discp"><div id="disc"></div>Discard</div>
    </div>
    <div id="msg"></div>
  </div>
  <div id="hand"></div>
  <div id="ctl">
    <button id="bgroup" class="sec">Group</button>
    <button id="bsort" class="sec">Sort</button>
    <button id="bdisc">Discard</button>
    <button id="bshow" class="red">Show</button>
    <button id="bdrop" class="red">Drop</button>
  </div>
</div>

<div id="modal" class="modal"><div class="mb" id="mb"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const socket = io();
const SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
const RK = (r) => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[r] || r);
const pid = localStorage.pid || (localStorage.pid = Math.random().toString(36).slice(2) + Date.now().toString(36));
let S = null, groups = [], sel = new Set(), modalKind = '';
const linkCode = ((location.pathname.match(/^\/r\/([A-Za-z0-9]+)/) || [])[1] || '').toUpperCase();
if (linkCode) localStorage.room = linkCode;
$('#name').value = localStorage.name || '';
$('#code').value = linkCode;

function cardEl(c, extra = '') {
  if (c.s === 'J') return `<div class="card joker ${extra}" data-id="${c.id}"><b>★</b><small>JOKER</small></div>`;
  const red = c.s === 'H' || c.s === 'D';
  const w = S && c.r === S.wildRank;
  return `<div class="card ${red ? 'red' : ''} ${w ? 'wild' : ''} ${extra}" data-id="${c.id}"><b>${RK(c.r)}</b><span>${SYM[c.s]}</span></div>`;
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = 'none'), 2600); }
function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); }

function nameOrWarn() {
  const n = $('#name').value.trim();
  if (!n) { toast('Enter your name first'); return null; }
  localStorage.name = n; return n;
}
function join(code, create) {
  const name = nameOrWarn(); if (!name) return;
  socket.emit('join', { code, pid, name, create });
}
$('#create').onclick = () => join('', true);
$('#join').onclick = () => { const c = $('#code').value.trim().toUpperCase(); if (c.length < 4) return toast('Enter room code'); join(c, false); };
socket.on('connect', () => { if (localStorage.name && localStorage.room) socket.emit('join', { code: localStorage.room, pid, name: localStorage.name, create: false }); });
socket.on('err', (m) => { toast(m); if (!S) { localStorage.removeItem('room'); } });

function invite() {
  const url = location.origin + '/r/' + S.code;
  const text = `Join my Rummy game 🃏\nRoom code: ${S.code}\n${url}`;
  if (window.AndroidBridge && AndroidBridge.share) AndroidBridge.share(text);
  else if (navigator.share) navigator.share({ text }).catch(() => {});
  else window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
$('#invite').onclick = invite;
$('#start').onclick = () => socket.emit('start');
$('#lleave').onclick = leave;
function leave() { socket.emit('leave'); localStorage.removeItem('room'); S = null; history.replaceState(null, '', '/'); show('home'); closeModal(); }

socket.on('state', (s) => {
  const prevHand = S && S.hand.map((c) => c.id).join();
  S = s;
  localStorage.room = s.code;
  if (location.pathname !== '/r/' + s.code) history.replaceState(null, '', '/r/' + s.code);
  groups = s.groups.map((g) => g.slice());
  sel = new Set([...sel].filter((id) => s.hand.some((c) => c.id === id)));
  render();
});

function render() {
  if (S.phase === 'lobby') return renderLobby();
  show('game');
  const meP = S.players.find((p) => p.pid === S.me);
  const myTurn = S.turnPid === S.me && S.phase === 'playing';
  $('#deal').textContent = 'Deal ' + S.dealNo;
  $('#wild').innerHTML = S.wild ? `<span style="display:inline-block;transform:scale(.6);margin:-12px -8px">${cardEl(S.wild)}</span>` : '';
  $('#players').innerHTML = S.players.map((p) => {
    const st = p.out ? 'OUT' : p.status === 'dropped' ? 'Dropped' : p.status === 'wrong' ? 'Wrong show' : p.cards ? p.cards + ' cards' : '';
    return `<div class="chip ${p.pid === S.turnPid ? 'turn' : ''} ${p.out || p.status === 'dropped' || p.status === 'wrong' ? 'gone' : ''}"><b>${esc(p.name)}${p.pid === S.me ? ' (you)' : ''}</b>${p.connected ? '' : ' ⚠'}<br>${st}<br>Total ${p.total}</div>`;
  }).join('');
  $('#stockn').textContent = S.stockCount;
  const top = S.discard[S.discard.length - 1];
  $('#disc').innerHTML = top ? cardEl(top, 'big') : '<div class="card big" style="opacity:.3"></div>';
  $('#stockp').classList.toggle('can', myTurn && S.turnPhase === 'draw');
  $('#discp').classList.toggle('can', myTurn && S.turnPhase === 'draw');
  const who = S.players.find((p) => p.pid === S.turnPid);
  $('#msg').textContent = S.phase !== 'playing' ? '' : myTurn ? (S.turnPhase === 'draw' ? 'Your turn: draw from Stock or Discard (or Drop)' : 'Select a card, then Discard or Show') : who ? `${who.name}'s turn` : '';
  const canPlay = meP && meP.status === 'active' && S.phase === 'playing';
  $('#bgroup').disabled = !canPlay || sel.size < 2;
  $('#bsort').disabled = !canPlay;
  $('#bdisc').disabled = !(myTurn && S.turnPhase === 'discard' && sel.size === 1);
  $('#bshow').disabled = !(myTurn && S.turnPhase === 'discard' && sel.size === 1);
  $('#bdrop').disabled = !(myTurn && S.turnPhase === 'draw');
  renderHand();
  if (S.phase === 'dealEnd') showResult(false);
  else if (S.phase === 'gameOver') showResult(true);
  else if (modalKind === 'result') closeModal();
}
function renderHand() {
  const m = Object.fromEntries(S.hand.map((c) => [c.id, c]));
  $('#hand').innerHTML = groups.map((g, gi) =>
    `<div class="grp">${g.map((id) => cardEl(m[id], sel.has(id) ? 'sel' : '')).join('')}${sel.size && !g.every((id) => sel.has(id)) ? `<button class="plus" data-g="${gi}">+</button>` : ''}</div>`
  ).join('');
}
function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderLobby() {
  show('lobby');
  $('#lcode').textContent = S.code;
  $('#lplayers').innerHTML = S.players.map((p) => `<div class="pl"><span>${esc(p.name)}${p.pid === S.host ? ' 👑' : ''}${p.pid === S.me ? ' (you)' : ''}</span><span>${p.connected ? '🟢' : '⚪'}</span></div>`).join('') + `<div class="small" style="margin-top:6px">${S.players.length}/6 players</div>`;
  const host = S.host === S.me;
  $('#start').style.display = host ? 'block' : 'none';
  $('#start').disabled = S.players.length < 2;
  $('#lwait').textContent = host ? (S.players.length < 2 ? 'Invite at least one friend to start.' : '') : 'Waiting for the host to start...';
}

$('#hand').onclick = (e) => {
  const plus = e.target.closest('.plus');
  if (plus) { moveSelTo(+plus.dataset.g); return; }
  const c = e.target.closest('.card'); if (!c) return;
  const id = +c.dataset.id;
  sel.has(id) ? sel.delete(id) : sel.add(id);
  render();
};
function pushArrange() { groups = groups.filter((g) => g.length); socket.emit('arrange', { groups }); }
function moveSelTo(gi) {
  const target = groups[gi];
  groups = groups.map((g) => g.filter((id) => !sel.has(id)));
  const order = S.hand.map((c) => c.id).filter((id) => sel.has(id));
  groups[gi] = groups[gi].concat(order);
  sel.clear(); pushArrange(); render();
}
$('#bgroup').onclick = () => {
  const order = S.hand.map((c) => c.id).filter((id) => sel.has(id));
  groups = groups.map((g) => g.filter((id) => !sel.has(id))).filter((g) => g.length);
  groups.push(order);
  sel.clear(); pushArrange(); render();
};
$('#bsort').onclick = () => {
  const bySuit = {};
  S.hand.forEach((c) => (bySuit[c.s] = bySuit[c.s] || []).push(c));
  groups = ['S', 'H', 'D', 'C', 'J'].filter((s) => bySuit[s]).map((s) => bySuit[s].sort((a, b) => a.r - b.r).map((c) => c.id));
  sel.clear(); pushArrange(); render();
};
$('#stockp').onclick = () => { if (S.turnPid === S.me && S.turnPhase === 'draw') socket.emit('draw', { from: 'stock' }); };
$('#discp').onclick = () => { if (S.turnPid === S.me && S.turnPhase === 'draw') socket.emit('draw', { from: 'discard' }); };
$('#bdisc').onclick = () => { const id = [...sel][0]; sel.clear(); socket.emit('discard', { cardId: id }); };
$('#bdrop').onclick = () => {
  if (confirm('Drop this deal? You will get ' + S.cfg.FIRST_DROP + ' points (first turn) or ' + S.cfg.MIDDLE_DROP + ' points (later).')) socket.emit('drop');
};
$('#bshow').onclick = () => {
  const id = [...sel][0];
  if (!confirm('Show with this card as your finish card? A wrong show costs ' + S.cfg.MAX_DEAL + ' points.')) return;
  const g = groups.map((x) => x.filter((c) => c !== id)).filter((x) => x.length);
  sel.clear(); socket.emit('declare', { discardId: id, groups: g });
};

function boardHtml() {
  const n = Math.max(0, ...S.players.map((p) => p.scores.length));
  const head = '<tr><th>Player</th>' + Array.from({ length: n }, (_, i) => `<th>D${i + 1}</th>`).join('') + '<th>Total</th></tr>';
  const rows = S.players.map((p) => `<tr><td>${esc(p.name)}${p.out ? ' ❌' : ''}</td>${Array.from({ length: n }, (_, i) => `<td>${p.scores[i] == null ? '-' : p.scores[i]}</td>`).join('')}<td><b>${p.total}</b></td></tr>`).join('');
  return `<table>${head}${rows}</table><div class="small" style="margin-top:6px">Out at ${S.cfg.TOTAL_OUT} points</div>`;
}
function openModal(kind, html) { modalKind = kind; $('#mb').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { modalKind = ''; $('#modal').classList.remove('on'); }
$('#board').onclick = () => { openModal('board', '<h3>Scoreboard</h3>' + boardHtml() + '<button id="mclose" style="width:100%;margin-top:10px">Close</button>'); $('#mclose').onclick = closeModal; };

function showResult(over) {
  const r = S.result; if (!r) return;
  const rows = r.rows.map((p) => `<div class="box" style="padding:8px"><b>${esc(p.name)}</b> ${p.won ? '🏆' : ''} — <b>${p.score}</b> pts ${p.status === 'dropped' ? '(dropped)' : p.status === 'wrong' ? '(wrong show)' : ''}${p.out ? ' ❌ OUT' : ''}<div class="mini">${p.groups.map((g) => `<div class="grp">${g.map((c) => cardEl(c)).join('')}</div>`).join('')}</div></div>`).join('');
  const host = S.host === S.me;
  let foot;
  if (over) {
    const w = S.players.find((p) => p.pid === S.gameWinner);
    foot = `<h2 style="text-align:center">🏆 ${esc(w ? w.name : '')} wins the game!</h2>` + (host ? '<button id="mnext" style="width:100%">Play again</button>' : '<div class="small" style="text-align:center">Host can start a new game</div>') + '<button id="mleave" class="sec" style="width:100%;margin-top:8px">Leave room</button>';
  } else {
    foot = '<div id="cd" class="small" style="text-align:center"></div>' + (host ? '<button id="mnext" style="width:100%;margin-top:6px">Next deal now</button>' : '');
  }
  if (modalKind !== 'result') { /* open fresh */ }
  openModal('result', `<h3>Deal ${r.dealNo}: ${esc(r.winnerName)} won</h3>${rows}<h4>Scoreboard</h4>${boardHtml()}${foot}`);
  const nb = $('#mnext'); if (nb) nb.onclick = () => socket.emit(over ? 'rematch' : 'next');
  const lb = $('#mleave'); if (lb) lb.onclick = leave;
}

setInterval(() => {
  if (!S) return;
  if (S.phase === 'playing') {
    const t = Math.max(0, Math.ceil((S.turnEndsAt - Date.now()) / 1000));
    $('#timer').textContent = '⏱ ' + t + 's';
  } else $('#timer').textContent = '';
  const cd = $('#cd'); if (cd && S.nextAt) cd.textContent = 'Next deal in ' + Math.max(0, Math.ceil((S.nextAt - Date.now()) / 1000)) + 's';
}, 500);
</script>
</body>
</html>
